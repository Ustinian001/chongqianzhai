<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>效果视频详情</title>
    <style>
        /* 全局重置，确保全屏黑底、无滚动条 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden;               /* 禁止滚动，防止手机端上下滑动 */
            /* 针对 iPhone 刘海屏安全区 */
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
        }

        /* 视频容器：占满整个视口，弹性居中，内部无多余间距 */
        .video-wrapper {
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #000;               /* 纯黑背景，融合视频黑边 */
        }

        /* 视频基础样式：强制内联播放，去除默认间距 */
        video {
            display: block;                 /* 消除行内元素间隙 */
            width: 100%;
            height: 100%;
            /*
               关键：使用 object-fit: contain 保证在电脑端完整显示视频内容，不会裁剪；
               但电脑端我们更希望全屏铺满？电脑端常见宽屏，如果希望完全铺满且不裁剪，可以用 cover。
               这里根据需求“电脑端全屏播放”，cover 会裁剪边缘但填满屏幕，含黑边情况较少。
               而手机端“自动适应屏幕”，通常也是指铺满且不变形 —— 使用 cover 最合适。
               如果希望视频完整显示不被裁剪，则应该用 contain（但两侧或上下会有黑边）。
               根据描述“自动适应屏幕”，综合判断：使用 cover 在电脑和手机都能全屏无黑边（裁剪少许）。
               但是电脑端如果用 cover 可能会把重要内容裁掉，如果视频是宽屏，显示器也是宽屏则没问题。
               所以这里使用 cover 作为默认，再通过媒体查询微调？其实 object-fit: cover 是首选。
               但为了“电脑端全屏播放”且不裁剪？实际上电脑全屏通常也是指填满浏览器窗口，所以 cover 更合适。
               为了保险，我们可以设置成 cover，并在极端宽高比时使用 contain 防止过度裁剪？不，保持简单。
               如果希望任何设备上都完整显示视频，就用 contain，但会有黑边。权衡后，我们采用 cover 以填满屏幕。
               而且原代码中也是 object-fit: cover，所以保持即可。
            */
            object-fit: cover;
            /* 保持视频质量，消除点击高亮 */
            outline: none;
            -webkit-tap-highlight-color: transparent;
        }

        /*
           针对电脑端(大屏)微调：保持 cover 全屏，但针对超宽屏，如果视频比例是16:9，显示器是21:9，
           使用 cover 会裁掉上下部分，可能不太友好。但考虑到全屏播放通常追求无黑边，所以保留 cover。
           如果有极致要求，可添加媒体查询，但多数情况不需要。
        */

        /* 防止 video 控件在部分手机浏览器上溢出 */
        .video-wrapper video {
            max-width: 100%;
            max-height: 100%;
        }

        /*
           移除控制条？原代码有 controls 属性，如果希望纯自动播放且无控件，可以去掉 controls。
           但需求未明确必须去除，保留 controls 方便用户手动全屏（电脑端）。
           注意：手机端如果显示控件，可能会遮挡；但可以接受。
           如果不想显示控件，删除 controls 属性即可。
           我们保留 controls 以满足手动全屏需求。
        */
    </style>
</head>
<body>
<div class="video-wrapper">
    <!--
        关键属性：
        - autoplay: 自动播放
        - muted: 静音 (移动端自动播放必需)
        - loop: 循环播放
        - playsinline / webkit-playsinline / x5-playsinline: 内联播放，防止iOS/微信强制全屏
        - controls: 显示控件，方便电脑端手动全屏
        - preload="auto": 预加载视频，减少卡顿
        - poster: 可选，设置封面图避免黑屏 (这里不设，保持黑色)
    -->
    <video
            controls
            autoplay
            muted
            loop
            playsinline
            webkit-playsinline
            x5-playsinline
            preload="auto"
    >
        <!-- 请确保路径正确，注意大小写和文件夹名称 -->
        <source src="Vidoe/Love%20Pop-up.mp4" type="video/mp4">
        <!-- 可以添加多个备用源，提高兼容性 -->
        <!-- <source src="Vidoe/Heartbeat.webm" type="video/webm"> -->
        您的浏览器不支持 HTML5 视频。
    </video>
</div>

<script>
    // 可选优化：确保视频在部分浏览器中能自动播放，并处理可能的错误
    (function() {
        const video = document.querySelector('video');
        if (!video) return;

        // 针对移动端自动播放策略，再次确保 muted 属性为 true
        video.muted = true;  // 强制静音，绕过自动播放限制

        // 尝试自动播放，若失败则监听用户交互
        const playVideo = () => {
            const playPromise = video.play();
            if (playPromise !== undefined) {
                playPromise.catch(error => {
                    console.warn('自动播放失败，需用户交互:', error);
                    // 静音状态下通常不会失败，但为了健壮性，添加点击播放
                    document.body.addEventListener('click', () => {
                        video.play().catch(e => console.warn('点击后播放失败:', e));
                    }, { once: true });
                });
            }
        };

        // 页面加载完成后尝试播放
        if (document.readyState === 'complete') {
            playVideo();
        } else {
            window.addEventListener('load', playVideo);
        }

        // 当视频因故暂停时，再次尝试播放（例如切回标签页）
        video.addEventListener('pause', () => {
            // 如果用户没有主动暂停（可通过 controls 触发），可考虑自动恢复，但可能干扰用户，所以不强制。
            // 若需要循环播放，loop 属性已处理，不用额外操作。
        });

        // 对于 iOS，有时需要触摸才能播放，这里再次尝试
        document.addEventListener('touchstart', () => {
            if (video.paused) {
                video.play().catch(e => console.warn('触摸后播放失败:', e));
            }
        }, { once: true });
    })();
</script>
</body>
</html>
