<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; base-uri 'none'; form-action 'none'; object-src 'none'; script-src 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:" />
  <meta name="referrer" content="no-referrer" />
  <link rel="icon" href="img/favicon.ico" sizes="48x48" />
  <link rel="icon" type="image/png" href="img/favicon-96.png" sizes="96x96" />
  <title>页面不存在</title>
  <style>
    :root { color-scheme: dark light; }
    html {
      background:
        radial-gradient(1300px 840px at 14% 10%, rgba(94, 234, 212, .28), transparent 65%),
        radial-gradient(1300px 840px at 86% 10%, rgba(244, 114, 182, .26), transparent 65%),
        radial-gradient(1200px 800px at 50% 4%, rgba(167, 139, 250, .28), transparent 65%),
        radial-gradient(1200px 800px at 10% 90%, rgba(251, 146, 60, .26), transparent 65%),
        radial-gradient(1200px 800px at 50% 96%, rgba(56, 189, 248, .26), transparent 65%),
        radial-gradient(1300px 840px at 90% 90%, rgba(129, 140, 248, .30), transparent 65%),
        linear-gradient(160deg, #141824, #0b0e14);
      background-attachment: fixed;
      background-color: #0b0e14;
    }
    body {
      margin: 0; min-height: 100vh;
      font-family: system-ui, sans-serif;
      text-align: center;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 24px;

      color: #e9ecf3;
    }
    /* 液态玻璃卡片：清透半透明 + 内高光 + 边缘折射亮线 */
    .glass-card {
      position: relative;
      width: min(360px, 100%);
      padding: 36px 28px;
      border-radius: 22px;
      border: 1px solid rgba(255, 255, 255, .18);
      background:
        linear-gradient(155deg, rgba(255, 255, 255, .14), rgba(255, 255, 255, .04) 42%, rgba(255, 255, 255, .02)),
        rgba(255, 255, 255, .08);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, .20),
        inset 0 -1px 0 rgba(255, 255, 255, .05),
        0 20px 44px -24px rgba(0, 0, 0, .55);
    }
    .glass-card::before {
      content: "";
      position: absolute; inset: 0;
      border-radius: inherit;
      background: linear-gradient(180deg, rgba(255, 255, 255, .12), transparent 42%);
      pointer-events: none;
    }
    .glass-card::after {
      content: "";
      position: absolute; left: 18px; right: 18px; bottom: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, .20), transparent);
      pointer-events: none;
    }
    h1, p { position: relative; z-index: 1; }
    h1 { margin: 0 0 10px; font-size: 2.6rem; font-weight: 800; letter-spacing: .04em; color: #f8fafc; }
    h1 span {
      background: linear-gradient(135deg, #5eead4, #818cf8);
      -webkit-background-clip: text; background-clip: text; color: transparent; }
    p { margin: 0; color: #98a2b5; }
    a { color: #5eead4; text-decoration: none; }

    /* 浅色主题：与首页浅色背景一致，避免深底发黑 */
    html[data-theme="light"] {
      background:
        radial-gradient(1300px 840px at 14% 10%, rgba(13, 148, 136, .24), transparent 65%),
        radial-gradient(1300px 840px at 86% 10%, rgba(225, 29, 129, .22), transparent 65%),
        radial-gradient(1200px 800px at 50% 4%, rgba(139, 92, 246, .24), transparent 65%),
        radial-gradient(1200px 800px at 10% 90%, rgba(234, 88, 12, .22), transparent 65%),
        radial-gradient(1200px 800px at 50% 96%, rgba(14, 165, 233, .22), transparent 65%),
        radial-gradient(1300px 840px at 90% 90%, rgba(99, 102, 241, .26), transparent 65%),
        linear-gradient(160deg, #f3f7f7, #eceff5);
      background-color: #eceff5;
      color: #0f172a;
    }
    [data-theme="light"] .glass-card {
      border-color: rgba(15, 23, 42, .12);
      background:
        linear-gradient(155deg, rgba(255, 255, 255, .50), rgba(255, 255, 255, .18) 42%, rgba(255, 255, 255, .10)),
        rgba(255, 255, 255, .30);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, .60),
        inset 0 -1px 0 rgba(255, 255, 255, .06),
        0 20px 44px -26px rgba(15, 23, 42, .18);
    }
    [data-theme="light"] .glass-card::before {
      background: linear-gradient(180deg, rgba(255, 255, 255, .60), transparent 42%);
    }
    [data-theme="light"] h1 span {
      background: linear-gradient(135deg, #0d9488, #6366f1);
      -webkit-background-clip: text; background-clip: text; color: transparent; }
    [data-theme="light"] p { color: #5c6679; }
    [data-theme="light"] a { color: #0d9488; }
  </style>
  <script>
    (function () {
      try {
        var t = localStorage.getItem('theme');
        if (!t) t = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <div class="glass-card">
    <h1><span>404</span></h1>
    <p>页面不存在。<a href="index.html">返回首页</a></p>
  </div>
</body>
</html>
